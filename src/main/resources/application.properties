spring.application.name=flash-sale-inventory-system
spring.datasource.url=jdbc:mysql://localhost:3307/flash_sale
spring.datasource.username=flashuser
spring.datasource.password=flashpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================================
# JPA / Hibernate
# ddl-auto=validate -> Hibernate creates/updates tables from your @Entity classes automatically.
# Switch to 'update' if u want to make entity to update.
# ==========================================================

spring.jpa.hibernate.ddl-auto = validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true



# ==========================================================
#Actuator
# Spring Boot Actuator is a feature that gives you endpoints to monitor your application.
# ==========================================================

management.endpoints.web.exposure.include=health