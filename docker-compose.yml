services:

  mysql:
    image: mysql:8.4
    container_name: flash-sale-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: flash_sale
      MYSQL_USER: flashuser
      MYSQL_PASSWORD: flashpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:

